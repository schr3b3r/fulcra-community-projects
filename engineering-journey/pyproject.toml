[project]
name = "engineering-journey-harness"
version = "0.1.0"
description = "A small, hand-rolled agent harness for building/running/extending Engineering Journey. Scaffolded from fulcra-agent-harness-starter."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "fulcra-api>=0.1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["harness", "harness.providers"]
